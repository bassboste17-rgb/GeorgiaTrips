  <link rel="stylesheet" href="navbar.css">
  <button class="mobile-menu-toggle" aria-label="Menu">

  </button>

  <div class="navbar-right">
    <nav class="nav-menu">
      <ul>
        <li><a href="home.html" data-i18n="navHome">Home</a></li>
        <li><a href="posts.html" data-i18n="navPosts">Posts</a></li>
        <li><a href="about.html" data-i18n="navAbout">About Us</a></li>

    <div class="languages">

<style>
  /* ========================================
     LOGO DESIGN
     ======================================== */
  
  .logo-link {
    text-decoration: none;
    display: inline-flex;
    flex-shrink: 0;
  }
  
  .logo-container {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  
  /* Logo Image */
  .logo-img {
    width: 48px;
    height: 48px;
    object-fit: contain;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 8px rgba(229, 56, 59, 0.3));
    transition: transform 0.3s ease;
  }
  
  /* Brand Text */
  .logo-text {
    display: flex;
    align-items: baseline;
    gap: 6px;
    position: relative;
  }
  
  .text-georgia {
    font-family: inherit;
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.5px;
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  
  .text-trips {
    font-family: inherit;
    font-size: 26px;
    font-weight: 700;
    color: #fcaf15;
    letter-spacing: -0.5px;
    position: relative;
    transition: all 0.3s ease;
    white-space: nowrap;
  }
  
  .text-trips::after {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, #fcaf15, #e5383b);
    transition: width 0.4s ease;
  }
  
  /* Hover Effects */
  .logo-link:hover .text-trips::after {
    width: 100%;
  }
  
  .logo-link:hover .logo-img {
    transform: scale(1.08);
  }
  
  .logo-link:hover .text-georgia {
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
  }
  
  .logo-link:hover .text-trips {
    color: #ff8a00;
    text-shadow: 0 0 15px rgba(252, 175, 21, 0.5);
  }
  
  /* Tablet */
  @media (max-width: 768px) {
    .logo-container {
      gap: 8px;
    }
    
    .logo-img {
      width: 40px;
      height: 40px;
    }
    
    .text-georgia,
    .text-trips {
      font-size: 22px;
    }
  }
  
  /* Mobile */
  @media (max-width: 480px) {
    .logo-container {
      gap: 6px;
    }
    
    .logo-img {
      width: 36px;
      height: 36px;
    }
    
    .text-georgia,
    .text-trips {
      font-size: 18px;
    }
  }
  
  /* Very Small Mobile */
  @media (max-width: 360px) {
    .logo-container {
      gap: 5px;
    }
    
    .logo-img {
      width: 32px;
      height: 32px;
    }
    
    .text-georgia,
    .text-trips {
      font-size: 15px;
    }
  }
</style>

<script>
// iOS Safari-ს მობილური მენიუს გაუმჯობესება
document.addEventListener('DOMContentLoaded', function() {
  const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
  const navbarRight = document.querySelector('.navbar-right');
  
  if (mobileMenuToggle && navbarRight) {
    mobileMenuToggle.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      navbarRight.classList.toggle('active');
      
      if (navbarRight.classList.contains('active')) {
        document.body.style.overflow = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.width = '100%';
      } else {
        document.body.style.overflow = '';
        document.body.style.position = '';
        document.body.style.width = '';
      }
    });
    
    mobileMenuToggle.addEventListener('touchend', function(e) {
      e.preventDefault();
    }, { passive: false });
    
    document.addEventListener('click', function(e) {
      if (!navbarRight.contains(e.target) && !mobileMenuToggle.contains(e.target)) {
        navbarRight.classList.remove('active');
        document.body.style.overflow = '';
        document.body.style.position = '';
        document.body.style.width = '';
      }
    });
    
    document.addEventListener('touchstart', function(e) {
      if (!navbarRight.contains(e.target) && !mobileMenuToggle.contains(e.target)) {
        navbarRight.classList.remove('active');
        document.body.style.overflow = '';
        document.body.style.position = '';
        document.body.style.width = '';
      }
    }, { passive: true });
  }
  
  const userMenu = document.querySelector('.user-menu');
  const dropdown = document.querySelector('.dropdown');
  
  if (userMenu && dropdown) {
    userMenu.addEventListener('click', function(e) {
      e.stopPropagation();
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    });
    
    userMenu.addEventListener('touchend', function(e) {
      e.preventDefault();
      e.stopPropagation();
      dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }, { passive: false });
    
    document.addEventListener('click', function() {
      if (dropdown) dropdown.style.display = 'none';
    });
    
    document.addEventListener('touchstart', function(e) {
      if (userMenu && !userMenu.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    }, { passive: true });
  }
});

function setViewportHeight() {
  let vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', `${vh}px`);
}

setViewportHeight();
window.addEventListener('resize', setViewportHeight);
window.addEventListener('orientationchange', function() {
  setTimeout(setViewportHeight, 100);
});

if (CSS.supports('-webkit-overflow-scrolling', 'touch')) {
  document.documentElement.style.cssText += '-webkit-overflow-scrolling: touch;';
}
</script>
