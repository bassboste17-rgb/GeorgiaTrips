<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
     
    <title>Georgia Trips | My Bookings </title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="addhome/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="addhome/logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="footer.css">
    
    <style>
:root {
  --primary-color: #fcaf15;
  --primary-hover: #e09a00;
  --secondary-color: #333;
  --text-color: #e0e0e0;
  --bg-dark: #0a0a0a;
  --light-bg: #1a1a1a;
  --border-color: #333;
  --success-color: #28a745;
  --error-color: #6c757d;
  --warning-color: #ffc107;
  --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 4px 8px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 8px 16px rgba(0, 0, 0, 0.4);
  --border-radius: 12px;
  --border-radius-sm: 8px;
  --transition: all 0.3s ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  overflow-x: hidden;
  scroll-behavior: smooth;
}

body {
  font-family: inherit;
  background: var(--bg-dark);
  color: var(--text-color);
  line-height: 1.6;
  min-height: 100vh;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem;
}

.hero {
  text-align: center;
  padding: 4rem 0 3rem;
  position: relative;
}

.header-actions {
  display: flex;
  justify-content: flex-start;
  margin-bottom: 2rem;
  position: relative;
  z-index: 1;
}

.btn {
  background: white;
  color: #000;
  border: none;
  border-radius: var(--border-radius-sm);
  padding: 0.875rem 1.75rem;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.btn:hover {
  background: var(--primary-hover);
  transform: translateY(-2px);
}

.btn-secondary {
  background: var(--light-bg);
  border: 1px solid var(--border-color);
  color: var(--text-color);
}

.btn-secondary:hover {
  background: var(--bg-dark);
  border-color: var(--primary-color);
  color: #fff;
}

.btn-danger {
  background: #495057;
  color: #fff;
}

.btn-danger:hover {
  background: #343a40;
}

.btn-sm {
  padding: 0.625rem 1.25rem;
  font-size: 0.875rem;
}

.hero h1 {
  color: #fff;
  font-size: 2.5rem;
  margin-bottom: 1rem;
  font-weight: 800;
  letter-spacing: -1px;
  position: relative;
  z-index: 1;
}

.hero h1 span {
  color: var(--primary-color);
}

.hero p {
  font-size: 1.125rem;
  margin-bottom: 2rem;
  color: var(--text-color);
  position: relative;
  z-index: 1;
}

.tabs {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 2rem;
  border-bottom: 2px solid var(--border-color);
  padding: 0 0.5rem;
  position: relative;
  z-index: 1;
}

.tab-btn {
  background: none;
  border: none;
  color: var(--text-color);
  padding: 1rem 2rem;
  cursor: pointer;
  font-size: 1rem;
  font-weight: 500;
  border-bottom: 3px solid transparent;
  transition: var(--transition);
  position: relative;
  border-radius: var(--border-radius-sm) var(--border-radius-sm) 0 0;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.tab-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.03);
}

.tab-btn.active {
  color: var(--primary-color);
  border-bottom-color: var(--primary-color);
  background: rgba(252, 175, 21, 0.05);
}

.notif-badge-tab {
  background: var(--primary-color);
  color: #000;
  border-radius: 50%;
  min-width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
}

.view {
  display: none;
  position: relative;
  z-index: 1;
}

.view.active {
  display: block;
}

.loading {
  text-align: center;
  padding: 4rem;
  font-size: 1.25rem;
  color: var(--text-color);
}

.loading i {
  font-size: 2.5rem;
  color: var(--primary-color);
  margin-bottom: 1rem;
  display: block;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  font-size: 1.15rem;
  color: var(--text-color);
  background: var(--light-bg);
  border-radius: var(--border-radius);
  border: 1px dashed var(--border-color);
}

.empty-state i {
  font-size: 3rem;
  color: var(--primary-color);
  margin-bottom: 1rem;
  display: block;
}

.empty-state h3 {
  color: #fff;
  margin-bottom: 0.5rem;
  font-size: 1.25rem;
}

.empty-state p {
  margin-bottom: 1.5rem;
}

.booking-card {
  background: var(--light-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);
  margin-bottom: 1.75rem;
  transition: var(--transition);
  overflow: hidden;
}

.booking-card:hover {
  border-color: var(--primary-color);
}

.booking-card-header {
  display: flex;
  gap: 1.5rem;
  padding: 1.5rem;
  border-bottom: 1px solid var(--border-color);
  align-items: center;
}

.booking-card-image {
  width: 120px;
  height: 80px;
  object-fit: cover;
  border-radius: var(--border-radius-sm);
  border: 1px solid var(--border-color);
  flex-shrink: 0;
}

.booking-card-title-section {
  flex: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.booking-card-title-section h3 {
  color: #fff;
  font-size: 1.25rem;
  font-weight: 600;
  margin: 0;
}

.booking-card-body {
  padding: 1.5rem;
}

.booking-dates-visual {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
  padding: 1.25rem;
  background: rgba(0, 0, 0, 0.2);
  border-radius: var(--border-radius-sm);
  border: 1px solid var(--border-color);
}

.booking-date-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 1rem;
  background: rgba(252, 175, 21, 0.1);
  border: 2px solid var(--primary-color);
  border-radius: var(--border-radius-sm);
  min-width: 80px;
}

.booking-date-day {
  font-size: 2rem;
  font-weight: 700;
  color: #fff;
  line-height: 1;
  margin-bottom: 0.25rem;
}

.booking-date-month {
  font-size: 0.875rem;
  color: var(--primary-color);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.booking-date-arrow {
  font-size: 1.5rem;
  color: var(--text-color);
  flex-shrink: 0;
}

.booking-date-duration {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0.75rem 1rem;
  background: rgba(255, 255, 255, 0.05);
  border-radius: var(--border-radius-sm);
  border: 1px solid var(--border-color);
  margin-left: auto;
}

.booking-date-duration-number {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--primary-color);
  line-height: 1;
}

.booking-date-duration-label {
  font-size: 0.75rem;
  color: var(--text-color);
  margin-top: 0.25rem;
}

.booking-info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.25rem;
}

.booking-info-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.875rem;
  background: rgba(255, 255, 255, 0.03);
  border-radius: var(--border-radius-sm);
  border: 1px solid var(--border-color);
}

.booking-info-icon {
  font-size: 1.25rem;
  color: var(--primary-color);
  flex-shrink: 0;
}

.booking-info-content {
  display: flex;
  flex-direction: column;
}

.booking-info-label {
  font-size: 0.75rem;
  color: var(--text-color);
  margin-bottom: 0.125rem;
}

.booking-info-value {
  font-size: 1rem;
  color: #fff;
  font-weight: 600;
}

.booking-status-message {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem 1.25rem;
  border-radius: var(--border-radius-sm);
  margin-bottom: 1.25rem;
  font-weight: 500;
}

.booking-status-message.pending {
  background: rgba(255, 193, 7, 0.1);
  border: 1px solid rgba(255, 193, 7, 0.3);
  color: var(--warning-color);
}

.booking-status-message.confirmed {
  background: rgba(40, 167, 69, 0.1);
  border: 1px solid rgba(40, 167, 69, 0.3);
  color: var(--success-color);
}

.booking-status-message.cancelled {
  background: rgba(108, 117, 125, 0.1);
  border: 1px solid rgba(108, 117, 125, 0.3);
  color: #adb5bd;
}

.refund-info {
  color: var(--success-color);
  font-size: 0.9rem;
  font-weight: 500;
  padding: 0.5rem 1rem;
  background: rgba(40, 167, 69, 0.1);
  border-radius: 6px;
  border: 1px solid rgba(40, 167, 69, 0.2);
  margin-top: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.booking-card-footer {
  padding: 1rem 1.5rem;
  background: rgba(0, 0, 0, 0.2);
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: flex-end;
  gap: 1rem;
}

.status-badge {
  padding: 0.5rem 1rem;
  border-radius: 20px;
  font-size: 0.875rem;
  font-weight: 600;
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.status-pending,
.status-მოლოდინში {
  background: var(--warning-color);
  color: #000;
}

.status-confirmed,
.status-დადასტურებული {
  background: var(--success-color);
  color: #fff;
}

.status-cancelled,
.status-გაუქმებული {
  background: #6c757d;
  color: #fff;
}

.notification-card {
  background: var(--light-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);
  padding: 1.75rem;
  margin-bottom: 1.25rem;
  transition: var(--transition);
}

.notification-card:hover {
  border-color: var(--primary-color);
}

.notification-card.unread {
  border-left: 4px solid var(--primary-color);
  background: rgba(252, 175, 21, 0.05);
}

.notification-header {
  display: flex;
  justify-content: space-between;
  align-items: start;
  margin-bottom: 0.75rem;
  gap: 1rem;
}

.notification-header h3 {
  color: #fff;
  font-size: 1.15rem;
  font-weight: 600;
}

.notification-time {
  font-size: 0.85rem;
  color: var(--text-color);
  white-space: nowrap;
  padding: 0.25rem 0.75rem;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 12px;
}

.notification-message {
  line-height: 1.7;
  color: var(--text-color);
}

.toast-container {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  max-width: 420px;
}

.toast {
  background: var(--light-bg);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);
  padding: 1.25rem 1.75rem;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: start;
  gap: 1.25rem;
  animation: toastSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

@keyframes toastSlideIn {
  from {
    opacity: 0;
    transform: translateX(100%) scale(0.9);
  }
  to {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
}

.toast-icon {
  font-size: 1.75rem;
  flex-shrink: 0;
}

.toast-content {
  flex: 1;
}

.toast-title {
  color: #fff;
  font-weight: 700;
  margin-bottom: 0.375rem;
}

.toast-message {
  color: var(--text-color);
  font-size: 0.9rem;
}

.toast-close {
  background: none;
  border: none;
  color: var(--text-color);
  cursor: pointer;
  font-size: 1.5rem;
  padding: 0;
}

.toast.success { border-left: 4px solid var(--success-color); }
.toast.success .toast-icon { color: var(--success-color); }
.toast.error { border-left: 4px solid #6c757d; }
.toast.error .toast-icon { color: #adb5bd; }
.toast.warning { border-left: 4px solid var(--warning-color); }
.toast.warning .toast-icon { color: var(--warning-color); }

.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(8px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}

.modal-content {
  background: var(--light-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--border-radius);
  padding: 2.5rem;
  max-width: 500px;
  width: 100%;
  animation: modalSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes modalSlideIn {
  from {
    opacity: 0;
    transform: translateY(-30px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.confirm-modal-content h2 {
  color: #fff;
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 1rem;
}

.confirm-modal-content p {
  color: var(--text-color);
  margin-bottom: 1.5rem;
  line-height: 1.6;
}

.confirm-actions {
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
}

@media (max-width: 768px) {
  .container {
    padding: 1rem;
  }
  
  .hero {
    padding: 2rem 0;
  }
  
  .hero h1 {
    font-size: 1.75rem;
  }
  
  .tabs {
    flex-direction: column;
    gap: 0.25rem;
    border-bottom: none;
  }
  
  .tab-btn {
    border-bottom: none;
    border-left: 3px solid transparent;
    border-radius: var(--border-radius-sm);
  }
  
  .tab-btn.active {
    border-bottom: none;
    border-left-color: var(--primary-color);
  }
  
  .booking-card-header {
    flex-direction: column;
    gap: 1rem;
  }
  
  .booking-card-image {
    width: 100%;
    height: 160px;
  }
  
  .booking-dates-visual {
    flex-direction: column;
    gap: 1rem;
  }
  
  .booking-date-arrow {
    transform: rotate(90deg);
  }
  
  .booking-date-duration {
    margin-left: 0;
  }
  
  .toast-container {
    top: 10px;
    right: 10px;
    left: 10px;
    max-width: none;
  }
}
    </style>
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>
    
    <div id="navbar"></div>
    
    <div class="container">
        <div class="hero">
            <div class="header-actions">
                <a href="booking.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i>
                    <span data-i18n="myBookingsBackBtn">უკან</span>
                </a>
            </div>
            
            <h1 data-i18n="myBookingsTitle">ჩემი <span data-i18n="myBookingsTitleHighlight">დაჯავშნები</span></h1>
            <p data-i18n="myBookingsSubtitle">მართეთ თქვენი დაჯავშნები და იხილეთ შეტყობინებები</p>
            
            <div class="tabs">
                <button class="tab-btn active" data-tab="bookings">
                    <i class="fas fa-calendar-check"></i>
                    <span data-i18n="myBookingsTabBookings">დაჯავშნები</span>
                </button>
                <button class="tab-btn" data-tab="notifications">
                    <i class="fas fa-bell"></i>
                    <span data-i18n="myBookingsTabNotifications">შეტყობინებები</span>
                    <span id="notifBadgeTab" class="notif-badge-tab" style="display: none;"></span>
                </button>
            </div>
            
            <div id="bookingsView" class="view active">
                <div id="myBookingsContainer">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <span data-i18n="bookingMyBookingsLoading">იტვირთება...</span>
                    </div>
                </div>
            </div>
            
            <div id="notificationsView" class="view">
                <div id="notificationsContainer"></div>
            </div>
        </div>
    </div>
    
    <div id="confirmModal" class="modal">
        <div class="modal-content confirm-modal-content">
            <h2 id="confirmTitle" data-i18n="myBookingsConfirmTitle">დადასტურება</h2>
            <p id="confirmMessage"></p>
            <div class="confirm-actions">
                <button class="btn btn-secondary" id="confirmCancel" data-i18n="myBookingsConfirmCancel">გაუქმება</button>
                <button class="btn btn-danger" id="confirmOk" data-i18n="myBookingsConfirmOk">დადასტურება</button>
            </div>
        </div>
    </div>
    
    <div id="footer"></div>
    
    <script type="module" src="navbar.js"></script>
    <script type="module" src="footer.js"></script>
    <script src="translations.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBBybpmsrByBZtwThfCd3u0pfHFjEL2ap0",
            authDomain: "rentime-e201e.firebaseapp.com",
            projectId: "rentime-e201e",
            storageBucket: "rentime-e201e.firebasestorage.app",
            messagingSenderId: "420054668757",
            appId: "1:420054668757:web:0accf1d8b9d621fd94195c",
            measurementId: "G-DGWLG9P1ZB"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let currentUser = null;

        function t(key, fallback) {
            return window.languageSwitcher?.translate(key) || fallback;
        }

        function showToast(message, type = 'info', title = '') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            
            toast.innerHTML = `
                <i class="toast-icon fas ${icons[type] || icons.info}"></i>
                <div class="toast-content">
                    ${title ? `<div class="toast-title">${title}</div>` : ''}
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close">&times;</button>
            `;
            
            container.appendChild(toast);
            toast.querySelector('.toast-close').addEventListener('click', () => toast.remove());
            setTimeout(() => toast.parentNode && toast.remove(), 5000);
        }

        function showConfirm(message, title) {
            return new Promise((resolve) => {
                const modal = document.getElementById('confirmModal');
                const titleEl = document.getElementById('confirmTitle');
                const messageEl = document.getElementById('confirmMessage');
                const okBtn = document.getElementById('confirmOk');
                const cancelBtn = document.getElementById('confirmCancel');
                
                titleEl.textContent = title || t('myBookingsConfirmTitle', 'დადასტურება');
                messageEl.textContent = message;
                modal.style.display = 'flex';
                
                const handleOk = () => {
                    modal.style.display = 'none';
                    cleanup();
                    resolve(true);
                };
                
                const handleCancel = () => {
                    modal.style.display = 'none';
                    cleanup();
                    resolve(false);
                };
                
                const cleanup = () => {
                    okBtn.removeEventListener('click', handleOk);
                    cancelBtn.removeEventListener('click', handleCancel);
                };
                
                okBtn.addEventListener('click', handleOk);
                cancelBtn.addEventListener('click', handleCancel);
            });
        }

        async function loadMyBookings() {
            const container = document.getElementById('myBookingsContainer');
            if (!container) return;

            if (!currentUser) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-sign-in-alt"></i>
                        <h3>${t('bookingMyBookingsLoginRequired', 'გთხოვთ შეხვიდეთ სისტემაში')}</h3>
                        <p>${t('myBookingsLoginDesc', 'დაჯავშნების სანახავად საჭიროა ავტორიზაცია')}</p>
                        <a href="login.html" class="btn">
                            <i class="fas fa-sign-in-alt"></i> ${t('myBookingsLoginBtn', 'შესვლა')}
                        </a>
                    </div>
                `;
                return;
            }

            try {
                container.innerHTML = `<div class="loading"><i class="fas fa-spinner"></i>${t('bookingMyBookingsLoading', 'იტვირთება...')}</div>`;

                const snapshot = await db.collection("bookings")
                    .where("userId", "==", currentUser.uid)
                    .get();

                let bookings = [];
                snapshot.forEach(doc => {
                    bookings.push({ id: doc.id, ...doc.data() });
                });

                bookings.sort((a, b) => {
                    const aTime = a.createdAt?.seconds || 0;
                    const bTime = b.createdAt?.seconds || 0;
                    return bTime - aTime;
                });

                if (bookings.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-calendar-times"></i>
                            <h3>${t('bookingMyBookingsEmpty', 'თქვენ არ გაქვთ დაჯავშნები')}</h3>
                            <p>${t('myBookingsEmptyDesc', 'დაჯავშნეთ მანქანა ან ტური რომ ნახოთ აქ')}</p>
                            <a href="booking.html" class="btn">               
                                        </a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = bookings.map(booking => createBookingCard(booking)).join('');

                container.querySelectorAll('.cancel-booking-btn').forEach(btn => {
                    btn.addEventListener('click', () => cancelBooking(btn.dataset.bookingId));
                });

            } catch (error) {
                console.error("Error loading bookings:", error);
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>${t('bookingMyBookingsLoadError', 'შეცდომა')}</h3><p>${error.message}</p></div>`;
            }
        }

        function createBookingCard(booking) {
            const statusClass = `status-${booking.status}`;
            const imageUrl = booking.itemImage || 'https://via.placeholder.com/800x400/1a1a1a/666666?text=No+Image';
            
            let bookingDays = booking.duration || 1;
            if (booking.selectedDates && booking.selectedDates.length > 0) {
                bookingDays = booking.selectedDates.length;
            } else if (booking.startDate && booking.endDate) {
                const start = new Date(booking.startDate);
                const end = new Date(booking.endDate);
                start.setHours(0, 0, 0, 0);
                end.setHours(0, 0, 0, 0);
                const diffTime = end.getTime() - start.getTime();
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                bookingDays = Math.max(1, diffDays + 1);
            }
            
            const formatDate = (dateStr) => {
                if (!dateStr) return '';
                const date = new Date(dateStr);
                const currentLang = window.languageSwitcher?.getCurrentLanguage() || 'ka';
                const locales = { ka: 'ka-GE', en: 'en-US', ru: 'ru-RU', ar: 'ar-SA' };
                return date.toLocaleDateString(locales[currentLang] || 'ka-GE');
            };

            const getDay = (dateStr) => {
                if (!dateStr) return '';
                return new Date(dateStr).getDate();
            };

            const startDate = formatDate(booking.startDate);
            const endDate = formatDate(booking.endDate);

            const statusPending = t('bookingMyBookingsStatusPending', 'მოლოდინში');
            const statusConfirmed = t('bookingMyBookingsStatusConfirmed', 'დადასტურებული');
            const statusCancelled = t('bookingMyBookingsStatusCancelled', 'გაუქმებული');
            const statusPendingMsg = t('bookingMyBookingsStatusPendingMsg', 'თქვენი დაჯავშნა მოლოდინის რეჟიმშია');
            const statusConfirmedMsg = t('bookingMyBookingsStatusConfirmedMsg', 'თქვენი დაჯავშნა დადასტურებულია!');
            const statusCancelledMsg = t('bookingMyBookingsStatusCancelledMsg', 'დაჯავშნა გაუქმებულია');
            const refundedText = t('bookingMyBookingsRefunded', 'თანხა დაბრუნებულია');
            const cancelText = t('bookingMyBookingsCancel', 'გაუქმება');
            const licensePlateText = t('bookingMyBookingsLicensePlate', 'სახელმწიფო ნომერი');
            const daysText = t('bookingMyBookingsDays', 'დღე');

            let translatedStatus = booking.status;
            if (booking.status === 'მოლოდინში') translatedStatus = statusPending;
            else if (booking.status === 'დადასტურებული') translatedStatus = statusConfirmed;
            else if (booking.status === 'გაუქმებული') translatedStatus = statusCancelled;

            let statusMessage = '';
            let actions = '';

            if (booking.status === 'მოლოდინში') {
                statusMessage = `<div class="booking-status-message pending"><i class="fas fa-clock"></i> ${statusPendingMsg}</div>`;
                actions = `<button class="btn btn-danger btn-sm cancel-booking-btn" data-booking-id="${booking.id}"><i class="fas fa-times"></i> ${cancelText}</button>`;
            } else if (booking.status === 'დადასტურებული') {
                statusMessage = `<div class="booking-status-message confirmed"><i class="fas fa-check-circle"></i> ${statusConfirmedMsg}</div>`;
                actions = `<button class="btn btn-danger btn-sm cancel-booking-btn" data-booking-id="${booking.id}"><i class="fas fa-times"></i> ${cancelText}</button>`;
            } else if (booking.status === 'გაუქმებული') {
                statusMessage = `<div class="booking-status-message cancelled"><i class="fas fa-times-circle"></i> ${statusCancelledMsg}</div>`;
                if (booking.refunded) {
                    statusMessage += `<div class="refund-info"><i class="fas fa-money-bill-wave"></i> ${refundedText}</div>`;
                }
            }

            const licensePlateHtml = booking.licensePlate 
                ? `<div class="booking-info-item">
                    <i class="booking-info-icon fas fa-id-card"></i>
                    <div class="booking-info-content">
                        <span class="booking-info-label">${licensePlateText}</span>
                        <span class="booking-info-value">${booking.licensePlate}</span>
                    </div>
                </div>`
                : '';

            return `
                <div class="booking-card">
                    <div class="booking-card-header">
                        <img src="${imageUrl}" alt="${booking.itemName}" class="booking-card-image">
                        <div class="booking-card-title-section">
                            <h3>${booking.itemName || t('myBookingsUnknown', 'უცნობი')}</h3>
                            <span class="status-badge ${statusClass}">${translatedStatus}</span>
                        </div>
                    </div>
                    <div class="booking-card-body">
                        ${statusMessage}
                        <div class="booking-dates-visual">
                            <div class="booking-date-box">
                                <div class="booking-date-day">${getDay(booking.startDate)}</div>
                                <div class="booking-date-month">${startDate}</div>
                            </div>
                            <div class="booking-date-arrow"><i class="fas fa-arrow-right"></i></div>
                            <div class="booking-date-box">
                                <div class="booking-date-day">${getDay(booking.endDate)}</div>
                                <div class="booking-date-month">${endDate}</div>
                            </div>
                            <div class="booking-date-duration">
                                <div class="booking-date-duration-number">${bookingDays}</div>
                                <div class="booking-date-duration-label">${daysText}</div>
                            </div>
                        </div>
                        ${licensePlateHtml ? `<div class="booking-info-grid">${licensePlateHtml}</div>` : ''}
                    </div>
                    ${actions ? `<div class="booking-card-footer">${actions}</div>` : ''}
                </div>
            `;
        }

        async function cancelBooking(bookingId) {
            const cancelTitle = t('bookingMyBookingsCancelTitle', 'დაჯავშნის გაუქმება');
            const cancelConfirm = t('bookingMyBookingsCancelConfirm', 'ნამდვილად გსურთ ამ დაჯავშნის გაუქმება?');
            
            const confirmed = await showConfirm(cancelConfirm, cancelTitle);
            if (!confirmed) return;

            try {
                await db.collection('bookings').doc(bookingId).update({
                    status: 'გაუქმებული',
                    cancelledAt: firebase.firestore.FieldValue.serverTimestamp(),
                    cancelledBy: currentUser.uid
                });

                await db.collection('notifications').add({
                    userId: currentUser.uid,
                    title: t('myBookingsNotifCancelledTitle', 'დაჯავშნა გაუქმებულია'),
                    message: t('myBookingsNotifCancelledMsg', 'თქვენი დაჯავშნა წარმატებით გაუქმდა'),
                    type: 'booking_cancelled',
                    read: false,
                    bookingId: bookingId,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast(t('bookingMyBookingsCancelled', 'დაჯავშნა წარმატებით გაუქმდა'), 'success');
                loadMyBookings();
                updateNotificationBadge();
            } catch (error) {
                console.error('Error cancelling booking:', error);
                showToast(t('bookingMyBookingsCancelFailed', 'დაჯავშნის გაუქმება ვერ მოხერხდა'), 'error');
            }
        }

        async function loadNotifications() {
            const container = document.getElementById('notificationsContainer');
            if (!container) return;

            if (!currentUser) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-sign-in-alt"></i>
                        <h3>${t('bookingNotificationLoginRequired', 'გთხოვთ შეხვიდეთ სისტემაში')}</h3>
                        <p>${t('myBookingsNotifLoginDesc', 'შეტყობინებების სანახავად საჭიროა ავტორიზაცია')}</p>
                        <a href="login.html" class="btn">
                            <i class="fas fa-sign-in-alt"></i> ${t('myBookingsLoginBtn', 'შესვლა')}
                        </a>
                    </div>
                `;
                return;
            }

            try {
                container.innerHTML = `<div class="loading"><i class="fas fa-spinner"></i>${t('bookingNotificationLoading', 'იტვირთება...')}</div>`;

                const snapshot = await db.collection('notifications')
                    .where('userId', '==', currentUser.uid)
                    .get();

                let notifications = [];
                snapshot.forEach(doc => {
                    notifications.push({ id: doc.id, ...doc.data() });
                });

                notifications.sort((a, b) => {
                    const aTime = a.createdAt?.seconds || 0;
                    const bTime = b.createdAt?.seconds || 0;
                    return bTime - aTime;
                });

                if (notifications.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-bell-slash"></i>
                            <h3>${t('bookingNotificationEmpty', 'თქვენ არ გაქვთ შეტყობინებები')}</h3>
                            <p>${t('myBookingsNotifEmptyDesc', 'შეტყობინებები გამოჩნდება როცა რაიმე ახალი მოხდება')}</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = notifications.map(notif => createNotificationCard(notif)).join('');

                notifications.forEach(async (notif) => {
                    if (!notif.read) {
                        try {
                            await db.collection('notifications').doc(notif.id).update({ read: true });
                        } catch (e) {
                            console.error('Error marking notification as read:', e);
                        }
                    }
                });

                updateNotificationBadge();

            } catch (error) {
                console.error('Error loading notifications:', error);
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>${t('bookingNotificationLoadError', 'შეცდომა')}</h3><p>${error.message}</p></div>`;
            }
        }

        function createNotificationCard(notif) {
            const unreadClass = notif.read ? '' : 'unread';
            const timeAgo = getTimeAgo(notif.createdAt);

            return `
                <div class="notification-card ${unreadClass}">
                    <div class="notification-header">
                        <h3>${notif.title || t('myBookingsNotifDefault', 'შეტყობინება')}</h3>
                        <span class="notification-time">${timeAgo}</span>
                    </div>
                    <div class="notification-message">${notif.message || ''}</div>
                </div>
            `;
        }

        function getTimeAgo(timestamp) {
            if (!timestamp) return t('bookingNotificationTimeJustNow', 'ახლახან');
            
            const now = new Date();
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const diff = now - date;
            
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            
            if (minutes < 1) return t('bookingNotificationTimeJustNow', 'ახლახან');
            if (minutes < 60) return `${minutes} ${t('bookingNotificationTimeMinutesAgo', 'წუთის წინ')}`;
            if (hours < 24) return `${hours} ${t('bookingNotificationTimeHoursAgo', 'საათის წინ')}`;
            return `${days} ${t('bookingNotificationTimeDaysAgo', 'დღის წინ')}`;
        }

        async function updateNotificationBadge() {
            const badge = document.getElementById('notifBadgeTab');
            if (!badge) return;
            
            if (!currentUser) {
                badge.style.display = 'none';
                return;
            }
            
            try {
                const snapshot = await db.collection('notifications')
                    .where('userId', '==', currentUser.uid)
                    .where('read', '==', false)
                    .get();
                
                if (snapshot.size > 0) {
                    badge.textContent = snapshot.size > 9 ? '9+' : snapshot.size;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            } catch (error) {
                console.error('Error updating badge:', error);
                badge.style.display = 'none';
            }
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;
                
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                
                if (tab === 'bookings') {
                    document.getElementById('bookingsView').classList.add('active');
                    loadMyBookings();
                } else if (tab === 'notifications') {
                    document.getElementById('notificationsView').classList.add('active');
                    loadNotifications();
                }
            });
        });

        auth.onAuthStateChanged((user) => {
            currentUser = user;
            loadMyBookings();
            updateNotificationBadge();
        });

        window.addEventListener('languageChanged', () => {
            const activeTab = document.querySelector('.tab-btn.active');
            if (activeTab?.dataset.tab === 'bookings') {
                loadMyBookings();
            } else {
                loadNotifications();
            }
        });
    </script>
    
    <script>
    function removeHtmlExtensionFromURL() {
        if (window.location.pathname.endsWith('.html')) {
            const newPath = window.location.pathname.replace(/\.html$/, '');
            const newURL = newPath + window.location.search + window.location.hash;
            window.history.replaceState({}, '', newURL);
        }
    }
    window.addEventListener('load', removeHtmlExtensionFromURL);
    </script>
    
</body>
</html>
