    }

    }
    
    .error {
      background: linear-gradient(135deg, #dc3545 0%, #ff6b6b 100%);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translate(-50%, -60%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

    /* Chat widget styles */
    .chat-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }
    
    .chat-button {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e5383b 0%, #ff6b6b 100%);

      cursor: pointer;

      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: visible;
    }
    
    .notification-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background-color: #ff0000;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #1a1a1a;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      animation: bounce 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      z-index: 10;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
      40% {transform: translateY(-6px);}
      60% {transform: translateY(-3px);}
    }
    
    .chat-button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .chat-button:hover::before {
      width: 100%;
      height: 100%;
    }

      transform: scale(1.1) rotate(5deg);
      box-shadow: 0 8px 25px rgba(229, 56, 59, 0.6);
    }

    }

    }

      flex: 1;

      flex-direction: column;

      border-radius: 3px;
    }
    
    .chat-messages::-webkit-scrollbar-thumb:hover {

    }

      }

      .office-address {
        font-size: 1.1rem;
        flex-direction: column;
        text-align: center;
      }

      .map-container {
        height: 350px;
      }

      .chat-window {
        width: calc(100vw - 40px);
        height: 75vh;
        bottom: 90px;
        right: 20px;
      }
      
      .chat-button {
        width: 60px;
        height: 60px;
      }
      
      .chat-button i {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>

  <div id="navbar"></div>
  <div id="popup-message" class="popup-message" style="display: none;" role="alert" aria-live="polite"></div>

  <main>
    <section class="contact-section" aria-labelledby="contact-heading">
      <div class="contact-container">
        <div class="contact-info">
          <h1 id="contact-heading" data-i18n="contactHeading">კონტაქტი</h1>
          <div class="contact-details">
            <p>
              <i class="fas fa-phone" aria-hidden="true"></i>
              <a href="tel:+995599186927" data-i18n="contactPhone" aria-label="დაგვირეკეთ ნომერზე +995 599 18 69 27">+995 599 18 69 27</a>
            </p>
            <p>
              <i class="fas fa-envelope" aria-hidden="true"></i>
              <a href="mailto:lominadzebusiness@gmail.com" data-i18n="contactEmail" aria-label="მოგვწერეთ ელ. ფოსტაზე">lominadzebusiness@gmail.com</a>
            </p>
            <p>
              <i class="fab fa-whatsapp" aria-hidden="true"></i>
              <a href="https://wa.me/995599186927" target="_blank" rel="noopener noreferrer" data-i18n="contactWhatsApp" aria-label="დაგვიკავშირდით WhatsApp-ით">+995 599 18 69 27</a>
            </p>
            <p>
              <i class="fas fa-clock" aria-hidden="true"></i>
              <span data-i18n="contactAvailability">24/7</span>
            </p>
          </div>
        </div>

        <div class="contact-form">
          <h2 data-i18n="contactFormTitle">მოგვწერე</h2>
          <form id="contact-form" aria-label="საკონტაქტო ფორმა">
            <div class="form-group">
              <label for="contact-name" class="sr-only">სახელი</label>
              <input type="text" id="contact-name" name="name" data-i18n="contactNamePlaceholder" placeholder="სახელი" required aria-required="true" />
            </div>
            <div class="form-group">
              <label for="contact-email" class="sr-only">ელ. ფოსტა</label>
              <input type="email" id="contact-email" name="email" data-i18n="contactEmailPlaceholder" placeholder="ელ. ფოსტა" required aria-required="true" />
            </div>
            <div class="form-group">
              <label for="contact-message" class="sr-only">შეტყობინება</label>
              <textarea id="contact-message" name="message" data-i18n="contactMessagePlaceholder" placeholder="შეტყობინება" required aria-required="true"></textarea>
            </div>
            <button type="submit" class="btn-primary" data-i18n="contactSubmitBtn">გაგზავნე</button>
          </form>
        </div>
      </div>
    </section>

    <section class="office-section" aria-labelledby="office-heading">
      <div class="office-container">
        <div class="office-header">
          <h2 id="office-heading" data-i18n="officeHeading">ჩვენი ოფისი</h2>
          <address class="office-address">
            <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
            <span data-i18n="officeAddress">ბათუმი, ბაგრატიონის ქუჩა 161</span>
          </address>
        </div>
        <div class="map-container">
          <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2973.0!2d41.6168!3d41.6168!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x406786e1e4d5c3f1%3A0x0!2sBagrationi%20Street%20161%2C%20Batumi!5e0!3m2!1sen!2sge!4v1234567890" 
            allowfullscreen="" 
            loading="lazy" 
            referrerpolicy="no-referrer-when-downgrade"
            title="Georgia Trips ოფისის მდებარეობა რუკაზე - ბათუმი, ბაგრატიონის 161"
            aria-label="Google Maps რუკა Georgia Trips ოფისის მდებარეობით">
          </iframe>
        </div>
      </div>
    </section>
  </main>

  <aside class="chat-widget" role="complementary" aria-label="ონლაინ ჩატი">
    <button class="chat-button" id="chatToggle" aria-label="გახსენით ონლაინ ჩატი" aria-expanded="false" aria-controls="chatWindow">
      <i class="fas fa-comments" aria-hidden="true"></i>
      <span class="notification-badge" id="chatBadge" style="display: none;" aria-live="polite">0</span>
    </button>
    
    <div class="chat-window" id="chatWindow" role="dialog" aria-labelledby="chat-title" aria-hidden="true">
      <div class="chat-header">
        <h3 id="chat-title" data-i18n="contactChatOnline">ონლაინ ჩატი</h3>
        <button class="chat-close" id="chatClose" aria-label="დახურეთ ჩატი">&times;</button>
      </div>
      
      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-relevant="additions">
        <div class="chat-message system">
          <div data-i18n="contactChatWelcome">მოგესალმებით! რით შემიძლია დაგეხმაროთ?</div>
        </div>
      </div>
      
      <div class="chat-input-container">
        <label for="chatInput" class="sr-only">დაწერეთ შეტყობინება</label>
        <input type="text" class="chat-input" id="chatInput" data-i18n="contactChatInputPlaceholder" placeholder="დაწერეთ შეტყობინება..." aria-label="შეტყობინების ველი" />
        <button class="chat-send" id="chatSend" aria-label="შეტყობინების გაგზავნა">
          <i class="fas fa-paper-plane" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </aside>

  <div id="footer"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged,
      signInAnonymously 
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";
    import { 
      getFirestore,
      collection,
      addDoc,
      doc,
      getDoc,
      getDocs,
      query,
      where,
      orderBy,
      onSnapshot,
      serverTimestamp,
      updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBybpmsrByBZtwThfCd3u0pfHFjEL2ap0",
      authDomain: "rentime-e201e.firebaseapp.com",
      projectId: "rentime-e201e",
      storageBucket: "rentime-e201e.firebasestorage.app",
      messagingSenderId: "420054668757",
      appId: "1:420054668757:web:0accf1d8b9d621fd94195c",
      measurementId: "G-DGWLG9P1ZB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentChatId = null;
    let messageCount = 0;
    let autoReplySent = false;
    let chatUnsubscribe = null;
    let messagesUnsubscribe = null;
    let chatInitialized = false;
    let lastMessageTime = 0;
    const MESSAGE_COOLDOWN = 4000;
    let cooldownTimer = null;
    let isSendingMessage = false;
    let pendingMessages = new Set();
    let unreadMessagesCount = 0;

    const chatToggle = document.getElementById('chatToggle');
    const chatWindow = document.getElementById('chatWindow');
    const chatClose = document.getElementById('chatClose');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const chatSend = document.getElementById('chatSend');
    const chatBadge = document.getElementById('chatBadge');

    // Language change handling
    window.addEventListener('languageChanged', () => {
      updateChatTranslations();
      updateContactFormTranslations();
      updateOfficeTranslations();
    });

    function updateOfficeTranslations() {
      const elements = {
        'officeHeading': 'textContent',
        'officeAddress': 'textContent'
      };
      for (const [key, prop] of Object.entries(elements)) {
        const el = document.querySelector(`[data-i18n="${key}"]`);
        if (el) el[prop] = window.languageSwitcher.translate(key);
      }
    }

    function updateChatTranslations() {
      const welcomeMsgElement = chatMessages.querySelector('.chat-message.system div');
      if (welcomeMsgElement && !currentChatId) {
        welcomeMsgElement.textContent = window.languageSwitcher.translate('contactChatWelcome');
      }
      const chatHeader = chatWindow.querySelector('.chat-header h3');
      if (chatHeader) chatHeader.textContent = window.languageSwitcher.translate('contactChatOnline');
      if (chatInput) chatInput.placeholder = window.languageSwitcher.translate('contactChatInputPlaceholder');
    }
    
    function updateContactFormTranslations() {
      const elements = {
        'contactTitle': 'textContent', 'contactHeading': 'textContent',
        'contactPhone': 'textContent', 'contactEmail': 'textContent',
        'contactWhatsApp': 'textContent', 'contactAvailability': 'textContent',
        'contactFormTitle': 'textContent', 'contactNamePlaceholder': 'placeholder',
        'contactEmailPlaceholder': 'placeholder', 'contactMessagePlaceholder': 'placeholder',
        'contactSubmitBtn': 'textContent'
      };
      for (const [key, prop] of Object.entries(elements)) {
        const el = document.querySelector(`[data-i18n="${key}"]`);
        if (el) {
          if (prop === 'placeholder') el.placeholder = window.languageSwitcher.translate(key);
          else el.textContent = window.languageSwitcher.translate(key);
        }
      }
    }

    // Toggle Chat
    chatToggle.addEventListener('click', () => {
      chatWindow.classList.toggle('open');
      const isOpen = chatWindow.classList.contains('open');
      chatToggle.setAttribute('aria-expanded', isOpen);
      chatWindow.setAttribute('aria-hidden', !isOpen);
      
      if (isOpen) {
        unreadMessagesCount = 0;
        updateBadge();
        
        if (currentUser && !chatInitialized) {
          initializeChat();
          chatInitialized = true;
        }
        setTimeout(() => {
          chatMessages.scrollTop = chatMessages.scrollHeight;
          chatInput.focus();
        }, 100);
      }
    });

    chatClose.addEventListener('click', () => {
      chatWindow.classList.remove('open');
      chatToggle.setAttribute('aria-expanded', 'false');
      chatWindow.setAttribute('aria-hidden', 'true');
    });

    chatSend.addEventListener('click', sendMessage);
    
    chatInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (!chatSend.disabled) {
           sendMessage();
        }
      }
    });

    function updateBadge() {
      if (unreadMessagesCount > 0) {
        chatBadge.textContent = unreadMessagesCount > 9 ? '9+' : unreadMessagesCount;
        chatBadge.style.display = 'flex';
      } else {
        chatBadge.style.display = 'none';
      }
    }

    // Auth State
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        if (!chatInitialized) {
            initializeChat();
            chatInitialized = true;
        }
      } else {
        try {
          const result = await signInAnonymously(auth);
          currentUser = result.user;
        } catch (error) {
          console.error("Auth failed", error);
          disableChatInput();
        }
      }
    });

    function cleanupChatListeners() {
      if (chatUnsubscribe) chatUnsubscribe();
      if (messagesUnsubscribe) messagesUnsubscribe();
      if (cooldownTimer) clearInterval(cooldownTimer);
    }

    function disableChatInput() {
      chatInput.disabled = true;
      chatInput.placeholder = window.languageSwitcher.translate('contactAuthRequired');
      chatSend.disabled = true;
      chatSend.classList.add('chat-disabled');
    }

    function enableChatInput() {
      if (!isSendingMessage && !cooldownTimer) {
        chatInput.disabled = false;
        chatInput.placeholder = window.languageSwitcher.translate('contactChatInputPlaceholder');
        chatSend.disabled = false;
        chatSend.classList.remove('chat-disabled');
      }
    }

    function showTypingIndicator() {
      const existing = document.getElementById('typing-indicator');
      if (existing) return;

      const indicator = document.createElement('div');
      indicator.id = 'typing-indicator';
      indicator.className = 'typing-indicator';
      indicator.setAttribute('aria-label', 'იწერება...');
      indicator.innerHTML = `
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      `;
      chatMessages.appendChild(indicator);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTypingIndicator() {
      const existing = document.getElementById('typing-indicator');
      if (existing) existing.remove();
    }

    function showChatMessage(senderName, text, type = 'user') {
      const messageDiv = document.createElement('div');
      messageDiv.className = `chat-message ${type}`;
      
      const locale = (window.languageSwitcher && window.languageSwitcher.currentLocale) || 'ka-GE';
      const time = new Date().toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' });
      
      messageDiv.innerHTML = `
        <div><strong>${senderName}</strong></div>
        <div>${text}</div>
        <div class="chat-message-time">${time}</div>
      `;
      
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function getUserName() {
      try {
        if (!currentUser) return window.languageSwitcher.translate('homeAnonymous');
        const userDoc = await getDoc(doc(db, "users", currentUser.uid));
        if (userDoc.exists() && userDoc.data().name) return userDoc.data().name;
        return window.languageSwitcher.translate('homeDefaultUserName');
      } catch (error) {
        return window.languageSwitcher.translate('homeDefaultUserName');
      }
    }

    async function initializeChat() {
      if (!currentUser) return;

      enableChatInput();

      const chatsRef = collection(db, "chats");
      const q = query(
        chatsRef, 
        where("userId", "==", currentUser.uid), 
        where("status", "in", ["active", "assigned"])
      );
      
      chatUnsubscribe = onSnapshot(q, async (snapshot) => {
        if (!snapshot.empty) {
          const activeChat = snapshot.docs[0];
          if (activeChat.data().status !== "closed") {
            if (currentChatId !== activeChat.id) {
               currentChatId = activeChat.id;
               loadMessages();
            }
          } else {
            resetChat();
          }
        } else {
          resetChat();
        }
      });
    }
    
    function resetChat() {
      currentChatId = null;
      if (messagesUnsubscribe) messagesUnsubscribe();
      chatMessages.innerHTML = `<div class="chat-message system"><div>${window.languageSwitcher.translate('contactChatWelcome')}</div></div>`;
    }

    async function createNewChat() {
       if(currentChatId) return;

       const userName = await getUserName();
       const userEmail = currentUser.email || 'anonymous@user.com';

       const chatDoc = await addDoc(collection(db, "chats"), {
          userId: currentUser.uid,
          userName: userName,
          userEmail: userEmail,
          status: "active",
          createdAt: serverTimestamp(),
          adminId: null,
          lastMessage: "",
          lastMessageBy: "user",
          lastMessageAt: serverTimestamp()
        });
        
        currentChatId = chatDoc.id;
        messageCount = 0;
        autoReplySent = false;
        
        loadMessages();
    }

    function loadMessages() {
      if (!currentChatId) return;
      
      if (messagesUnsubscribe) messagesUnsubscribe();

      const messagesRef = collection(db, "chats", currentChatId, "messages");
      const q = query(messagesRef, orderBy("timestamp", "asc"));

      messagesUnsubscribe = onSnapshot(q, (snapshot) => {
        chatMessages.innerHTML = '';
        removeTypingIndicator();

        let newMessagesReceived = false;

        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          showChatMessage(msg.senderName || 'მომხმარებელი', msg.text, msg.senderType);
          
          if (!chatWindow.classList.contains('open') && msg.senderType !== 'user' && msg.senderType !== 'system') {
             newMessagesReceived = true;
          }
        });

        if (newMessagesReceived) {
            unreadMessagesCount++;
            updateBadge();
        }

        chatMessages.scrollTop = chatMessages.scrollHeight;
      });
    }

    async function sendMessage() {
      if (isSendingMessage || (cooldownTimer !== null)) {
        return;
      }

      const text = chatInput.value.trim();
      if (!text || !currentUser) return;

      isSendingMessage = true;
      chatSend.disabled = true;
      chatSend.classList.add('chat-disabled');
      chatInput.disabled = true;
      chatSend.innerHTML = `<i class="fas fa-spinner fa-spin" aria-hidden="true"></i>`;

      const messageId = `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;

      try {
        const now = Date.now();
        if (now - lastMessageTime < MESSAGE_COOLDOWN) {
             throw new Error("Cooldown active");
        }

        if (!currentChatId) {
          await createNewChat();
          await new Promise(r => setTimeout(r, 500)); 
        }

        const userName = await getUserName();

        await addDoc(collection(db, "chats", currentChatId, "messages"), {
          text: text,
          senderType: "user",
          senderId: currentUser.uid,
          senderName: userName,
          timestamp: serverTimestamp(),
          messageId: messageId
        });

        await updateDoc(doc(db, "chats", currentChatId), {
          lastMessage: text,
          lastMessageBy: "user",
          lastMessageAt: serverTimestamp()
        });

        chatInput.value = '';
        messageCount++;
        lastMessageTime = Date.now();
        
        if (messageCount === 1 && !autoReplySent) {
          showTypingIndicator();
          setTimeout(async () => {
            try {
              removeTypingIndicator();
              await addDoc(collection(db, "chats", currentChatId, "messages"), {
                text: window.languageSwitcher.translate('contactSystemReply'),
                senderType: "admin",
                senderId: "system",
                senderName: window.languageSwitcher.translate('contactSystemName'),
                timestamp: serverTimestamp()
              });
              autoReplySent = true;
            } catch (error) {
              console.error("Auto-reply error", error);
            }
          }, 1500);
        }

      } catch (error) {
        console.error("Message send failed:", error);
        if (error.message !== "Cooldown active") {
             showChatMessage('System', window.languageSwitcher.translate('contactMessageSendFailed'), 'system');
        }
      } finally {
        let remainingTime = MESSAGE_COOLDOWN / 1000;
        chatSend.innerHTML = `<span style="font-size: 0.8rem">${remainingTime}</span>`;
        
        isSendingMessage = false;

        if (cooldownTimer) clearInterval(cooldownTimer);
        
        cooldownTimer = setInterval(() => {
          remainingTime--;
          if (remainingTime > 0) {
            chatSend.innerHTML = `<span style="font-size: 0.8rem">${remainingTime}</span>`;
          } else {
            clearInterval(cooldownTimer);
            cooldownTimer = null;
            chatSend.disabled = false;
            chatSend.classList.remove('chat-disabled');
            chatSend.innerHTML = '<i class="fas fa-paper-plane" aria-hidden="true"></i>';
            chatInput.disabled = false;
            chatInput.focus();
          }
        }, 1000);
      }
    }

    // Contact Form Logic
    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const popup = document.getElementById('popup-message');
      emailjs.sendForm('service_fjymp06', 'template_btyx9a9', this)
        .then(() => {
          popup.textContent = window.languageSwitcher.translate('contactSuccessMessage');
          popup.style.display = 'block';
          popup.className = 'popup-message success';
          popup.setAttribute('role', 'alert');
          this.reset();
          setTimeout(() => popup.style.display = 'none', 5000);
        }, (error) => {
          popup.textContent = window.languageSwitcher.translate('contactErrorMessage') + ' ' + error.text;
          popup.style.display = 'block';
          popup.className = 'popup-message error';
          popup.setAttribute('role', 'alert');
          setTimeout(() => popup.style.display = 'none', 5000);
        });
    });

    // Cleanup
    window.addEventListener('beforeunload', cleanupChatListeners);
    
    function removeHtmlExtensionFromURL() {
      if (window.location.pathname.endsWith('.html')) {
        const newPath = window.location.pathname.replace(/\.html$/, '');
        const newURL = newPath + window.location.search + window.location.hash;
        window.history.replaceState({}, '', newURL);
      }
    }

    window.addEventListener('load', removeHtmlExtensionFromURL);
    window.addEventListener('popstate', removeHtmlExtensionFromURL);
  </script>

  <script src="footer.js"></script>
  <script type="module" src="navbar.js"></script>

</body>
