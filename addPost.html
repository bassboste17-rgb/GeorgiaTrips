<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="addPostTitle">Create Post | Georgia Trips</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="addhome/logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="addhome/logo.png">
<link rel="icon" type="image/png" sizes="32x32" href="addhome/logo.png">
<link rel="icon" type="image/png" sizes="16x16" href="addhome/logo.png">
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: inherit;
        }
        
        :root {
            --primary-color: #e5383b;
            --primary-hover: #d42e2b;
            --secondary-color: #352d2d27;
            --text-primary: #fff;
            --text-secondary: #ccc;
            --background-light: #0f0f0f;
            --background-dark: #000000be;
            --border-color: #555;
            --border-radius: 8px;
            --transition: all 0.3s ease;
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 25%, #334155 50%, #475569 75%, #64748b 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            min-height: 100vh;
            padding: 20px;
            padding-top: 90px;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* RTL Support for Arabic */
        [dir="rtl"] .toast-container {
            right: auto;
            left: 20px;
        }

        [dir="rtl"] .toast {
            border-left: none;
            border-right: 4px solid;
        }

        [dir="rtl"] .toast.warning { border-right-color: #f59e0b; }
        [dir="rtl"] .toast.error { border-right-color: #ef4444; }
        [dir="rtl"] .toast.success { border-right-color: #22c55e; }
        [dir="rtl"] .toast.info { border-right-color: #3b82f6; }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            position: relative;
            z-index: 1;
        }
        
        header {
            background-color: var(--background-light);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            grid-column: 1 / -1;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .user-menu {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-menu a {
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .user-menu a:hover {
            color: var(--primary-color);
        }
        
        .sidebar {
            background-color: var(--background-light);
            border-radius: 15px;
            padding: 20px;
            height: fit-content;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .profile-card {
            text-align: center;
        }
        
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
        }
        
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
        }
        
        .profile-info h2 {
            margin-bottom: 5px;
            font-size: 22px;
        }
        
        .profile-info p {
            color: var(--text-secondary);
            margin-bottom: 15px;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .main-content {
            background-color: var(--background-light);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            background: var(--background-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            font-size: 16px;
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        
        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        
        .btn {
            padding: 12px 25px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn:hover {
            background: var(--primary-hover);
        }
        
        .btn-block {
            width: 100%;
            padding: 15px;
        }
        
        .upload-container {
            border: 2px dashed var(--border-color);
            border-radius: var(--border-radius);
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            transition: border-color 0.3s, background 0.3s;
        }

        .upload-container:hover {
            border-color: var(--primary-color);
            background: rgba(229, 56, 59, 0.05);
        }
        
        .upload-icon {
            font-size: 50px;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .upload-icon i {
            margin: 0 10px;
        }
        
        .upload-text {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .upload-note {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .file-input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }
        
        .media-preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }
        
        .media-preview {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            background: var(--background-dark);
        }
        
        .preview-image, .preview-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .remove-media {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(229, 56, 59, 0.9);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            z-index: 2;
            transition: transform 0.2s;
        }

        .remove-media:hover {
            transform: scale(1.1);
        }

        .media-badge {
            position: absolute;
            bottom: 5px;
            left: 5px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 2;
        }

        .media-badge.video {
            background: rgba(229, 56, 59, 0.9);
        }

        .media-badge.image {
            background: rgba(59, 130, 246, 0.9);
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        
        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .spinner {
            width: 70px;
            height: 70px;
            display: inline-block;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        .loading-text {
            color: white;
            margin-top: 15px;
            font-size: 18px;
            text-align: center;
        }
        
        .success-message {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #fff;
            padding: 15px;
            border-radius: var(--border-radius);
            margin-top: 20px;
            display: none;
        }

        .toast-container {
            position: fixed;
            top: 100px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
        }

        .toast {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px 20px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: toastSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform-origin: right center;
            min-width: 320px;
            position: relative;
            overflow: hidden;
        }

        .toast.toast-hiding {
            animation: toastSlideOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes toastSlideIn {
            0% { transform: translateX(120%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes toastSlideOut {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(120%); opacity: 0; }
        }

        .toast-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
            color: #fff;
        }

        .toast-message {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.4;
        }

        .toast-close {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: rgba(255, 255, 255, 0.5);
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .toast-close:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            border-radius: 0 0 12px 12px;
            animation: toastProgress 4s linear forwards;
        }

        @keyframes toastProgress {
            0% { width: 100%; }
            100% { width: 0%; }
        }

        .toast.warning { border-left: 4px solid #f59e0b; }
        .toast.warning .toast-icon { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .toast.warning .toast-progress { background: linear-gradient(90deg, #f59e0b, #fbbf24); }

        .toast.error { border-left: 4px solid #ef4444; }
        .toast.error .toast-icon { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .toast.error .toast-progress { background: linear-gradient(90deg, #ef4444, #f87171); }

        .toast.success { border-left: 4px solid #22c55e; }
        .toast.success .toast-icon { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .toast.success .toast-progress { background: linear-gradient(90deg, #22c55e, #4ade80); }

        .toast.info { border-left: 4px solid #3b82f6; }
        .toast.info .toast-icon { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .toast.info .toast-progress { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        
        @media (max-width: 768px) {
            body {
                padding-top: 70px;
            }
            
            .container {
                grid-template-columns: 1fr;
            }
            
            .media-preview-container {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            
            .media-preview {
                width: 100px;
                height: 100px;
            }

            .upload-icon {
                font-size: 40px;
            }

            .upload-icon i {
                margin: 0 5px;
            }

            .toast-container {
                top: 80px;
                right: 10px;
                left: 10px;
                max-width: none;
            }

            .toast {
                min-width: auto;
            }
        }
    </style>
</head>
<body>
    <div id="navbar"></div>

    <div class="toast-container" id="toast-container"></div>

    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <div class="loading-text" data-i18n="addPostLoading">პოსტი იტვირთება...</div>
        </div>
    </div>
    
    <div class="container">
        <aside class="sidebar">
            <div class="profile-card">
                <div class="avatar-container">
                    <img src="https://via.placeholder.com/150" alt="Avatar" class="avatar" id="user-avatar">
                </div>
                <div class="profile-info">
                    <h2 id="profile-name" data-i18n="addPostUser">მომხმარებელი</h2>
                    <p id="profile-email">user@example.com</p>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="post-count">0</div>
                        <div class="stat-label" data-i18n="addPostStatPosts">განცხადება</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">0</div>
                        <div class="stat-label" data-i18n="addPostStatVisits">ვიზიტი</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <h2 class="section-title" data-i18n="addPostSectionTitle">ახალი პოსტის დამატება</h2>
            
            <form id="post-form">
                <div class="form-group">
                    <label for="content" data-i18n="addPostContentLabel">პოსტის აღწერა</label>
                    <textarea id="content" data-i18n-placeholder="addPostContentPlaceholder" placeholder="დაწერეთ პოსტის აღწერა..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label data-i18n="addPostMediaLabel">ფოტოები და ვიდეოები</label>
                    <div class="upload-container">
                        <div class="upload-icon">
                            <i class="fas fa-image"></i>
                            <i class="fas fa-video"></i>
                        </div>
                        <div class="upload-text" data-i18n="addPostUploadText">დააჭირეთ ან გადმოათრიეთ ფოტოები და ვიდეოები ასატვირთად</div>
                        <div class="upload-note" data-i18n="addPostUploadNote">მაქსიმუმ 10 ფოტო და 3 ვიდეო (ვიდეო მაქს. 100MB)</div>
                        <input type="file" id="media-upload" class="file-input" accept="image/*,video/*" multiple>
                    </div>
                    
                    <div class="media-preview-container" id="media-preview-container">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="region" data-i18n="addPostRegionLabel">რეგიონი</label>
                    <select id="region" required>
                        <option value="" disabled selected data-i18n="addPostRegionPlaceholder">აირჩიეთ რეგიონი</option>
                        <option value="afkhazeti" data-i18n="regionAbkhazia">აფხაზეთი</option>
                        <option value="achara" data-i18n="regionAdjara">აჭარა</option>
                        <option value="guria" data-i18n="regionGuria">გურია</option>
                        <option value="imereti" data-i18n="regionImereti">იმერეთი</option>
                        <option value="kakheti" data-i18n="regionKakheti">კახეთი</option>
                        <option value="kvemo-kartli" data-i18n="regionKvemoKartli">ქვემო ქართლი</option>
                        <option value="mtsketa-mtianeti" data-i18n="regionMtskhetaMtianeti">მცხეთა-მთიანეთი</option>
                        <option value="racha-lechkhumi" data-i18n="regionRachaLechkhumi">რაჭა-ლეჩხუმი და ქვემო სვანეთი</option>
                        <option value="samtskhe-javakheti" data-i18n="regionSamtskheJavakheti">სამცხე-ჯავახეთი</option>
                        <option value="shida-kartli" data-i18n="regionShidaKartli">შიდა ქართლი</option>
                        <option value="samegrelo-svaneti" data-i18n="regionSamegrelo">სამეგრელო-ზემო სვანეთი</option>
                        <option value="tbilisi" data-i18n="regionTbilisi">თბილისი</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="location" data-i18n="addPostLocationLabel">მდებარეობა</label>
                    <input type="text" id="location" data-i18n-placeholder="addPostLocationPlaceholder" placeholder="მიუთითეთ ზუსტი მდებარეობა" required>
                </div>
                
                <button type="submit" class="btn btn-block" data-i18n="addPostSubmitBtn">გამოქვეყნება</button>
            </form>
            
            <div class="success-message" id="success-message">
                <i class="fas fa-check-circle"></i> <span data-i18n="addPostSuccessMessage">პოსტი წარმატებით დაემატა!</span>
            </div>
        </main>
    </div>

        // მიმდინარე ენის მიღება
        function getCurrentLanguage() {
            // პირველ რიგში შევამოწმოთ გლობალური currentLanguage
            if (typeof currentLanguage !== 'undefined' && currentLanguage) {
                return currentLanguage;
            }
            // შემდეგ localStorage
            const savedLang = localStorage.getItem('language');
            if (savedLang && localTranslations[savedLang]) {
                return savedLang;
            }
            // default
            return 'ka';
        }

        // თარგმანის ფუნქცია
        function t(key) {
            const lang = getCurrentLanguage();
            return localTranslations[lang]?.[key] || localTranslations['ka'][key] || key;
        }

        const postForm = document.getElementById('post-form');
        const userAvatar = document.getElementById('user-avatar');
        const profileName = document.getElementById('profile-name');
        const profileEmail = document.getElementById('profile-email');
        const postCount = document.getElementById('post-count');
        const contentInput = document.getElementById('content');
        const mediaUpload = document.getElementById('media-upload');
        const mediaPreviewContainer = document.getElementById('media-preview-container');
        const regionSelect = document.getElementById('region');
        const locationInput = document.getElementById('location');
        const loadingOverlay = document.getElementById('loading-overlay');
        const successMessage = document.getElementById('success-message');
        const toastContainer = document.getElementById('toast-container');

        let selectedImages = [];
        let selectedVideos = [];
        let userData = null;

        // Toast Notification System
        function showToast(type, titleKey, messageKey, duration = 4000) {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                warning: 'fa-exclamation-triangle',
                error: 'fa-times-circle',
                success: 'fa-check-circle',
                info: 'fa-info-circle'
            };

            const title = t(titleKey);
            const message = t(messageKey);
            
            toast.innerHTML = `
                <div class="toast-icon">
                    <i class="fas ${icons[type]}"></i>
                </div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close">
                    <i class="fas fa-times"></i>
                </button>
                <div class="toast-progress"></div>
            `;
            
            toastContainer.appendChild(toast);
            
            const closeBtn = toast.querySelector('.toast-close');
            closeBtn.addEventListener('click', () => {
                removeToast(toast);
            });
            
            setTimeout(() => {
                removeToast(toast);
            }, duration);
        }
        
        function removeToast(toast) {
            if (toast && toast.parentElement) {
                toast.classList.add('toast-hiding');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            checkAuthState();
        });

        function checkAuthState() {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    await loadUserData(user);
                } else {
                    window.location.href = "login.html";
                }
            });
        }

        async function loadUserData(user) {
            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                if (userDoc.exists()) {
                    const userDataFromDB = userDoc.data();
                    profileName.textContent = userDataFromDB.name || user.displayName || t('addPostUser');
                    profileEmail.textContent = userDataFromDB.email || user.email;
                    
                    if (userDataFromDB.avatar) {
                        userAvatar.src = userDataFromDB.avatar;
                    } else if (user.photoURL) {
                        userAvatar.src = user.photoURL;
                    }
                    
                    userData = {
                        uid: user.uid,
                        name: userDataFromDB.name || user.displayName || "",
                        email: userDataFromDB.email || user.email,
                        avatar: userDataFromDB.avatar || user.photoURL || ""
                    };
                } else {
                    profileName.textContent = user.displayName || t('addPostUser');
                    profileEmail.textContent = user.email;
                    
                    if (user.photoURL) {
                        userAvatar.src = user.photoURL;
                    }
                    
                    userData = {
                        uid: user.uid,
                        name: user.displayName || "",
                        email: user.email,
                        avatar: user.photoURL || ""
                    };
                }
            } catch (error) {
                console.error("მონაცემების ჩატვირთვის შეცდომა:", error);
            }
        }

        mediaUpload.addEventListener('change', function(e) {
            const files = e.target.files;
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                if (file.type.startsWith('image/')) {
                    if (selectedImages.length >= 10) {
                        showToast('warning', 'toastLimitTitle', 'toastMaxPhotos');
                        continue;
                    }
                    selectedImages.push(file);
                    createMediaPreview(file, 'image');
                    
                } else if (file.type.startsWith('video/')) {
                    if (selectedVideos.length >= 3) {
                        showToast('warning', 'toastLimitTitle', 'toastMaxVideos');
                        continue;
                    }
                    
                    if (file.size > 100 * 1024 * 1024) {
                        showToast('error', 'toastSizeTitle', 'toastVideoSize');
                        continue;
                    }
                    
                    selectedVideos.push(file);
                    createMediaPreview(file, 'video');
                } else {
                    showToast('error', 'toastInvalidTitle', 'toastInvalidFile');
                }
            }
            
            e.target.value = '';
        });

        function createMediaPreview(file, type) {
            const previewDiv = document.createElement('div');
            previewDiv.className = 'media-preview';
            
            if (type === 'image') {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'preview-image';
                    previewDiv.appendChild(img);
                };
                
                reader.readAsDataURL(file);
                
                const badge = document.createElement('div');
                badge.className = 'media-badge image';
                badge.innerHTML = `<i class="fas fa-image"></i> ${t('badgePhoto')}`;
                previewDiv.appendChild(badge);
                
            } else if (type === 'video') {
                const video = document.createElement('video');
                video.src = URL.createObjectURL(file);
                video.className = 'preview-video';
                video.muted = true;
                
                video.addEventListener('mouseenter', function() {
                    video.play();
                });
                video.addEventListener('mouseleave', function() {
                    video.pause();
                    video.currentTime = 0;
                });
                
                previewDiv.appendChild(video);
                
                const badge = document.createElement('div');
                badge.className = 'media-badge video';
                badge.innerHTML = `<i class="fas fa-play"></i> ${t('badgeVideo')}`;
                previewDiv.appendChild(badge);
            }
            
            const removeBtn = document.createElement('div');
            removeBtn.className = 'remove-media';
            removeBtn.innerHTML = '<i class="fas fa-times"></i>';
            removeBtn.addEventListener('click', function() {
                if (type === 'image') {
                    const index = selectedImages.indexOf(file);
                    if (index > -1) {
                        selectedImages.splice(index, 1);
                    }
                } else {
                    const index = selectedVideos.indexOf(file);
                    if (index > -1) {
                        selectedVideos.splice(index, 1);
                    }
                    const video = previewDiv.querySelector('video');
                    if (video) {
                        URL.revokeObjectURL(video.src);
                    }
                }
                previewDiv.remove();
            });
            
            previewDiv.appendChild(removeBtn);
            mediaPreviewContainer.appendChild(previewDiv);
        }

        async function uploadImagesToCloudinary(files) {
            const imageUrls = [];
            
            for (const file of files) {
                const formData = new FormData();
                formData.append("file", file);
                formData.append("upload_preset", UPLOAD_PRESET);
                
                try {
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
                        method: "POST",
                        body: formData
                    });
                    
                    if (!res.ok) {
                        throw new Error('Upload failed');
                    }
                    
                    const data = await res.json();
                    imageUrls.push(data.secure_url);
                } catch (error) {
                    console.error("ფოტოს ატვირთვის შეცდომა:", error);
                    throw error;
                }
            }
            
            return imageUrls;
        }

        async function uploadVideosToCloudinary(files) {
            const videoUrls = [];
            
            for (const file of files) {
                const formData = new FormData();
                formData.append("file", file);
                formData.append("upload_preset", UPLOAD_PRESET);
                formData.append("resource_type", "video");
                
                try {
                    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                        method: "POST",
                        body: formData
                    });
                    
                    if (!res.ok) {
                        throw new Error('Upload failed');
                    }
                    
                    const data = await res.json();
                    videoUrls.push(data.secure_url);
                } catch (error) {
                    console.error("ვიდეოს ატვირთვის შეცდომა:", error);
                    throw error;
                }
            }
            
            return videoUrls;
        }

        postForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!userData) {
                showToast('info', 'toastWaitTitle', 'toastWaitMessage');
                return;
            }
            
            if (selectedImages.length === 0 && selectedVideos.length === 0) {
                showToast('warning', 'toastMediaRequiredTitle', 'toastMediaRequired');
                return;
            }
            
            showLoading();
            
            try {
                let imageUrls = [];
                let videoUrls = [];

                if (selectedImages.length > 0) {
                    imageUrls = await uploadImagesToCloudinary(selectedImages);
                }

                if (selectedVideos.length > 0) {
                    videoUrls = await uploadVideosToCloudinary(selectedVideos);
                }
                
                const postData = {
                    content: contentInput.value,
                    images: imageUrls,
                    videos: videoUrls,
                    region: regionSelect.value,
                    location: locationInput.value,
                    authorId: userData.uid,
                    authorName: userData.name,
                    authorAvatar: userData.avatar,
                    createdAt: serverTimestamp(),
                    likes: 0,
                    views: 0
                };
                
                await addDoc(collection(db, "posts"), postData);
                
                showToast('success', 'toastSuccessTitle', 'toastSuccessMessage');
                
                postForm.reset();
                selectedImages = [];
                selectedVideos = [];
                mediaPreviewContainer.innerHTML = '';
                
            } catch (error) {
                console.error("პოსტის დამატების შეცდომა:", error);
                showToast('error', 'toastErrorTitle', 'toastErrorMessage');
            } finally {
                hideLoading();
            }
        });

        function showLoading() {
            loadingOverlay.classList.add('active');
        }
        
        function hideLoading() {
            loadingOverlay.classList.remove('active');
        }

        function removeHtmlExtensionFromURL() {
            if (window.location.pathname.endsWith('.html')) {
                const newPath = window.location.pathname.replace(/\.html$/, '');
                const newURL = newPath + window.location.search + window.location.hash;
                window.history.replaceState({}, '', newURL);
            }
        }

        window.addEventListener('load', removeHtmlExtensionFromURL);
        window.addEventListener('popstate', removeHtmlExtensionFromURL);
    </script>
