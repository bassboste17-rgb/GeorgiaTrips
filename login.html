<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Facebook Login Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1877f2, #0f3d91);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #1877f2;
      color: white;
    }

    button:hover {
      background: #145dbf;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Facebook Login</h1>
    <button onclick="facebookLogin()">Login with Facebook</button>
    <div class="status" id="status"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getAuth,
      FacebookAuthProvider,
      signInWithRedirect,
      getRedirectResult
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    // 🔥 შენი Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBBybpmsrByBZtwThfCd3u0pfHFjEL2ap0",
      authDomain: "rentime-e201e.firebaseapp.com",
      projectId: "rentime-e201e",
      appId: "1:420054668757:web:0accf1d8b9d621fd94195c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const provider = new FacebookAuthProvider();
    provider.addScope("public_profile");
    provider.addScope("email");

    // 👇 ღილაკზე დაჭერა
    window.facebookLogin = function () {
      document.getElementById("status").innerText = "Redirecting to Facebook...";
      signInWithRedirect(auth, provider);
    };

    // 👇 redirect-ის შემდეგ შედეგი
    getRedirectResult(auth)
      .then((result) => {
        if (result && result.user) {
          document.getElementById("status").innerText =
            "Welcome, " + result.user.displayName;
        }
      })
      .catch((error) => {
        console.error(error);
        document.getElementById("status").innerText =
          "Login failed: " + error.message;
      });
  </script>

</body>
</html>
