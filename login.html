<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firebase Facebook + Phone Auth Test</title>
  <script type="module">
    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, FacebookAuthProvider, signInWithPopup, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyBBybpmsrByBZtwThfCd3u0pfHFjEL2ap0",
      authDomain: "rentime-e201e.firebaseapp.com",
      projectId: "rentime-e201e",
      storageBucket: "rentime-e201e.firebasestorage.app",
      messagingSenderId: "420054668757",
      appId: "1:420054668757:web:0accf1d8b9d621fd94195c",
      measurementId: "G-DGWLG9P1ZB"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ---------------------------
    // Facebook Login
    // ---------------------------
    const fbButton = document.getElementById("facebook-login");
    fbButton.addEventListener("click", () => {
      const provider = new FacebookAuthProvider();
      provider.setCustomParameters({ auth_type: 'reauthenticate' }); // optional

      signInWithPopup(auth, provider)
        .then((result) => {
          const user = result.user;
          alert(`Facebook Login Success!\nName: ${user.displayName}\nEmail: ${user.email}`);
        })
        .catch((error) => {
          console.error(error);
          alert(`Facebook Login Error: ${error.message}`);
        });
    });

    // ---------------------------
    // Phone Auth
    // ---------------------------
    window.recaptchaVerifier = new RecaptchaVerifier(
      "recaptcha-container",
      { size: "invisible" },
      auth
    );

    const phoneButton = document.getElementById("phone-login");
    phoneButton.addEventListener("click", () => {
      const phoneNumber = document.getElementById("phone-number").value;
      const appVerifier = window.recaptchaVerifier;

      signInWithPhoneNumber(auth, phoneNumber, appVerifier)
        .then((confirmationResult) => {
          window.confirmationResult = confirmationResult;
          const code = prompt("Enter the verification code sent to your phone:");
          return confirmationResult.confirm(code);
        })
        .then((result) => {
          alert(`Phone Login Success! User UID: ${result.user.uid}`);
        })
        .catch((error) => {
          console.error(error);
          alert(`Phone Login Error: ${error.message}`);
        });
    });

  </script>
</head>
<body>
  <h1>Firebase Auth Test</h1>

  <!-- Facebook Login -->
  <button id="facebook-login">Login with Facebook</button>

  <hr>

  <!-- Phone Login -->
  <input type="text" id="phone-number" placeholder="+9955XXXXXXXX">
  <button id="phone-login">Login with Phone</button>
  <div id="recaptcha-container"></div>

  <p>Check the console for errors or success messages.</p>
</body>
</html>
