<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Firebase Auth Combo Test</title>

<!-- Facebook JS SDK -->
<div id="fb-root"></div>
<script async defer crossorigin="anonymous"
  src="https://connect.facebook.net/en_US/sdk.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, FacebookAuthProvider, signInWithPopup, signInWithCredential, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // ---------------------------
  // Firebase Config
  // ---------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyBBybpmsrByBZtwThfCd3u0pfHFjEL2ap0",
    authDomain: "rentime-e201e.firebaseapp.com",
    projectId: "rentime-e201e",
    storageBucket: "rentime-e201e.firebasestorage.app",
    messagingSenderId: "420054668757",
    appId: "1:420054668757:web:0accf1d8b9d621fd94195c",
    measurementId: "G-DGWLG9P1ZB"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ---------------------------
  // Facebook JS SDK init
  // ---------------------------
  window.fbAsyncInit = function() {
    FB.init({
      appId      : '1118509420324444', // შენი Facebook App ID
      cookie     : true,
      xfbml      : true,
      version    : 'v17.0'
    });
  };

  document.addEventListener("DOMContentLoaded", () => {
    const fbButton = document.getElementById("facebook-login");
    const phoneButton = document.getElementById("phone-login");
    const loginResult = document.getElementById("login-result");
    const nameInput = document.getElementById("name-input");

    // ---------------------------
    // Facebook Login
    // ---------------------------
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    if (isMobile) {
      fbButton.addEventListener("click", () => {
        FB.login(function(response) {
          if (response.authResponse) {
            const accessToken = response.authResponse.accessToken;
            const credential = FacebookAuthProvider.credential(accessToken);

            signInWithCredential(auth, credential)
              .then(result => showUser(result.user))
              .catch(err => showError(err));
          } else {
            alert('User cancelled login or did not authorize.');
          }
        }, {scope: 'email,public_profile'});
      });
    } else {
      fbButton.addEventListener("click", () => {
        const provider = new FacebookAuthProvider();
        signInWithPopup(auth, provider)
          .then(result => showUser(result.user))
          .catch(err => showError(err));
      });
    }

    // ---------------------------
    // Phone Auth
    // ---------------------------
    if (!window.recaptchaVerifier) {
      window.recaptchaVerifier = new RecaptchaVerifier(
        "recaptcha-container",
        { size: "invisible" },
        auth
      );
      window.recaptchaVerifier.render();
    }

    phoneButton.addEventListener("click", () => {
      const phoneNumber = document.getElementById("phone-number").value;
      const name = nameInput.value.trim();
      if (!phoneNumber) return alert("Enter a valid phone number");
      if (!name) return alert("Enter your name");

      signInWithPhoneNumber(auth, phoneNumber, window.recaptchaVerifier)
        .then(confirmationResult => {
          const code = prompt("Enter the verification code sent to your phone:");
          return confirmationResult.confirm(code);
        })
        .then(result => showUser(result.user, name))
        .catch(err => showError(err));
    });

    // ---------------------------
    // Helper functions
    // ---------------------------
    function showUser(user, name = null) {
      console.log("Logged in user:", user);
      loginResult.innerHTML = `
        <p>✅ Welcome, ${name || user.displayName || user.phoneNumber}</p>
        <p>Email: ${user.email || 'Not provided'}</p>
        ${user.photoURL ? `<img src="${user.photoURL}" width="100" />` : ''}
      `;
    }

    function showError(err) {
      console.error(err);
      loginResult.innerHTML = `<p style="color:red">Login failed: ${err.message}</p>`;
    }
  });
</script>

<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #1e3c72, #2a5298);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }

  h1 {
    margin-bottom: 20px;
    text-shadow: 1px 1px 5px #000;
  }

  input, button {
    font-size: 16px;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin: 5px;
  }

  button#facebook-login {
    background-color: #4267B2;
    color: #fff;
    cursor: pointer;
  }

  button#facebook-login:hover {
    background-color: #365899;
  }

  button#phone-login {
    background-color: #28a745;
    color: #fff;
    cursor: pointer;
  }

  button#phone-login:hover {
    background-color: #1e7e34;
  }

  #login-result {
    margin-top: 20px;
    text-align: center;
    background-color: rgba(0,0,0,0.2);
    padding: 15px;
    border-radius: 10px;
  }

  img {
    margin-top: 10px;
    border-radius: 50%;
  }
</style>
</head>
<body>
  <h1>Firebase Auth Test</h1>

  <!-- Name input -->
  <input type="text" id="name-input" placeholder="Enter your name">

  <!-- Facebook Login -->
  <button id="facebook-login">Login with Facebook</button>

  <hr style="width:80%; border-color: rgba(255,255,255,0.3)">

  <!-- Phone Login -->
  <input type="text" id="phone-number" placeholder="+9955XXXXXXXX">
  <button id="phone-login">Login with Phone</button>
  <div id="recaptcha-container"></div>

  <div id="login-result"></div>
</body>
</html>
