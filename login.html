<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firebase Facebook Login Test</title>
  <script type="module">
    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, FacebookAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // ---------------------------
    // Firebase Config
    // ---------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBBybpmsrByBZtwThfCd3u0pfHFjEL2ap0",
      authDomain: "rentime-e201e.firebaseapp.com",
      projectId: "rentime-e201e",
      storageBucket: "rentime-e201e.firebasestorage.app",
      messagingSenderId: "420054668757",
      appId: "1:420054668757:web:0accf1d8b9d621fd94195c",
      measurementId: "G-DGWLG9P1ZB"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ---------------------------
    // Facebook Login
    // ---------------------------
    function facebookLogin() {
      const provider = new FacebookAuthProvider();

      signInWithPopup(auth, provider)
        .then((result) => {
          const user = result.user;
          console.log("Logged in user:", user);
          document.getElementById("login-result").innerHTML = `
            <p>✅ Welcome, ${user.displayName}</p>
            <p>Email: ${user.email || 'Not provided'}</p>
            <img src="${user.photoURL || ''}" alt="Profile photo" width="100">
          `;
        })
        .catch((error) => {
          console.error(error);
          document.getElementById("login-result").innerHTML = `<p style="color:red">Login failed: ${error.message}</p>`;
        });
    }
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      margin-bottom: 40px;
      text-shadow: 1px 1px 5px #000;
    }

    button {
      background-color: #4267B2;
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
      margin-bottom: 20px;
    }

    button:hover {
      background-color: #365899;
    }

    #login-result {
      margin-top: 20px;
      text-align: center;
      background-color: rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 10px;
    }

    img {
      margin-top: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <h1>Facebook Login Test</h1>
  <button onclick="facebookLogin()">Login with Facebook</button>

  <div id="login-result"></div>
</body>
</html>
